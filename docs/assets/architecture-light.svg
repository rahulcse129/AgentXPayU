  .vert { fill: none; stroke: #9aa1b0; stroke-width: 1.6; stroke-dasharray: 4 5; animation: dash 1.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -26; } }
  @media (prefers-reduced-motion: reduce) { .flow, .flow-ok, .vert { animation: none; } }
  .lay { font-size: 17px; font-weight: 700; fill: #1b1d24; }
  .vert-card { fill: none; stroke: #2fae9c; stroke-width: 2; stroke-dasharray: 4 5; animation: dash 1.4s linear infinite; }
</style>
