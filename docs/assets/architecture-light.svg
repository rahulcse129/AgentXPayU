<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .bl { font-size: 13px; font-weight: 700; fill: #14161c; }
  .bs { font-size: 10.5px; fill: #14161c; opacity: .78; }
  .tl { font-size: 13px; font-weight: 600; fill: #1b1d24; }
  .tm { font-size: 12px; fill: #5b6170; }
  .flow { fill: none; stroke: #9aa1b0; stroke-width: 2; stroke-dasharray: 7 6; animation: dash 1.1s linear infinite; }
