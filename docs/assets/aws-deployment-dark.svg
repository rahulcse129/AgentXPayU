<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" width="980" height="690" role="img" aria-label="Margin on AWS: Route 53 and an HTTPS load balancer with a Cognito login in front of one ECS Fargate task running the dashboard and engine, with EFS, Secrets Manager, CloudWatch and ECR; the engine reaches Airwallex and Metal through a NAT gateway; GitHub Actions deploys with CDK through an OIDC role">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .bl { font-size: 13px; font-weight: 700; fill: #14161c; }
  .bs { font-size: 10.5px; fill: #14161c; opacity: .78; }
  .tl { font-size: 13px; font-weight: 600; fill: #e8eaf0; }
  .tm { font-size: 11.5px; fill: #9ba2b0; }
  .lay { font-size: 17px; font-weight: 700; fill: #e8eaf0; }
  .flow { fill: none; stroke: #6b7280; stroke-width: 1.8; stroke-dasharray: 7 6; animation: dash 1.1s linear infinite; }
  .flow-ok { fill: none; stroke: #3fae6c; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -26; } }
  @media (prefers-reduced-motion: reduce) { .flow, .flow-ok { animation: none; } }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  <marker id="arrowok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fae6c"/></marker>
</defs>
<rect x="190" y="56" width="770" height="470" rx="16" fill="rgba(233,164,60,.07)" stroke="#e9a43c" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="208" y="80" class="lay">AWS</text><text x="252" y="80" class="tm">ap-south-1 · one VPC · infra/ (CDK)</text>
<rect x="20" y="200" width="150" height="70" rx="9" fill="#cfd4de" stroke="rgba(0,0,0,.18)"/>
<text x="95" y="231.5" text-anchor="middle" class="bl">Visitor's browser</text>
<text x="95" y="246.5" text-anchor="middle" class="bs">dashboard + Drop-in</text>
