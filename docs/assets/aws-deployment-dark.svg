<text x="850" y="215.5" text-anchor="middle" class="bs">margin/app: rail keys</text>
<rect x="760" y="252" width="180" height="56" rx="9" fill="#bcd7ff" stroke="rgba(0,0,0,.18)"/>
<text x="850" y="276.5" text-anchor="middle" class="bl">CloudWatch Logs</text>
<text x="850" y="291.5" text-anchor="middle" class="bs">engine · dashboard</text>
<rect x="760" y="328" width="180" height="56" rx="9" fill="#bcd7ff" stroke="rgba(0,0,0,.18)"/>
<text x="850" y="352.5" text-anchor="middle" class="bl">ECR</text>
<text x="850" y="367.5" text-anchor="middle" class="bs">engine + dashboard images</text>
<rect x="760" y="420" width="180" height="70" rx="9" fill="#bcd7ff" stroke="rgba(0,0,0,.18)"/>
<text x="850" y="451.5" text-anchor="middle" class="bl">NAT gateway</text>
<text x="850" y="466.5" text-anchor="middle" class="bs">the engine's only way out</text>
<rect x="450" y="550" width="510" height="120" rx="12" fill="#21252d" stroke="#2a2f39"/>
<text x="464" y="572" class="tl"></text>
<text x="464" y="658" class="tl">Outside AWS</text><text x="552" y="658" class="tm">the payment rails and the LLM, reached through the NAT gateway</text>
