<text x="715" y="590.5" text-anchor="middle" class="bl">Metal testnet</text>
<text x="715" y="605.5" text-anchor="middle" class="bs">x402 · mandate</text>
<rect x="810" y="566" width="130" height="56" rx="9" fill="#cfd4de" stroke="rgba(0,0,0,.18)"/>
<text x="875" y="590.5" text-anchor="middle" class="bl">LLM (optional)</text>
