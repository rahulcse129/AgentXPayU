<text x="585" y="314" text-anchor="middle" class="bs">orchestrator, startup sweeper</text>
<text x="585" y="385" text-anchor="middle" class="tm">mode: ENGINE_SCRIPT (offline … live-full)</text>
<rect x="760" y="100" width="180" height="56" rx="9" fill="#bcd7ff" stroke="rgba(0,0,0,.18)"/>
