<text x="315" y="444" text-anchor="middle" class="bl">CloudFormation</text>
<text x="315" y="459" text-anchor="middle" class="bs">OIDC role, no stored</text>
<text x="315" y="474" text-anchor="middle" class="bs">AWS keys in GitHub</text>
