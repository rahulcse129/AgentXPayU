<text x="315" y="224" text-anchor="middle" class="bl">Load balancer (ALB)</text>
<text x="315" y="239" text-anchor="middle" class="bs">HTTPS · ACM certificate</text>
<text x="315" y="254" text-anchor="middle" class="bs">/api/* → engine · /* → dashboard</text>
