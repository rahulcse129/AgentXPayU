<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="Margin: an AI agent that spends inside the customer's card hold">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .bl { font-size: 13px; font-weight: 700; fill: #14161c; }
  .bs { font-size: 10.5px; fill: #14161c; opacity: .78; }
  .tl { font-size: 13px; font-weight: 600; fill: #e8eaf0; }
  .tm { font-size: 12px; fill: #9ba2b0; }
  .flow { fill: none; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 7 6; animation: dash 1.1s linear infinite; }
  .flow-ok { fill: none; stroke: #3fae6c; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 1.1s linear infinite; }
  .flow-bad { fill: none; stroke: #e5584d; stroke-width: 2.2; stroke-dasharray: 4 5; }
  .vert { fill: none; stroke: #6b7280; stroke-width: 1.6; stroke-dasharray: 4 5; animation: dash 1.4s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -26; } }
  @media (prefers-reduced-motion: reduce) { .flow, .flow-ok, .vert { animation: none; } }
  .chip { fill: #14301f; stroke: #3fae6c; }
  .chipt { font-size: 13px; font-weight: 700; fill: #5fd394; }
  .h1 { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; fill: #e8eaf0; }
  .h2 { font-size: 23px; font-weight: 600; fill: #e8eaf0; }
  .h3 { font-size: 15px; fill: #9ba2b0; }
  .pill { fill: none; stroke: #30353f; }
  .pillt { font-size: 12.5px; font-weight: 600; fill: #9ba2b0; }
  .dot-live { fill: #3fae6c; } .dot-sim { fill: #8e7cf0; }
</style>
